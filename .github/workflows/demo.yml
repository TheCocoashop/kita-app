# Veröffentlicht die Demo (kita-app/index.html mit erfundenen Daten) als Webseite:
# https://thecocoashop.github.io/kita-app/
name: Demo veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - "kita-app/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kita-app
      - id: deployment
        uses: actions/deploy-pages@v4
